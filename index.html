<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Souhardo Calculator</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f2f2f2;
text-align:center;
transition:.3s;
}

body.dark{
background:#1f1f1f;
color:white;
}

.calculator{
width:360px;
margin:40px auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.2);
transition:.3s;
}

body.dark .calculator{
background:#2d2d2d;
}

input{
width:90%;
padding:10px;
margin:8px;
font-size:18px;
}


button{
padding:10px 15px;
margin:5px;
font-size:18px;
cursor:pointer;
border:none;
border-radius:8px;
transition:0.2s ease;
}

body.dark button{
background:#444;
color:white;
}

/* এখান থেকে নতুন কোড */

button:hover{
transform:translateY(-3px);
box-shadow:0 8px 18px rgba(0,0,0,.25);
}

button:active{
transform:scale(.95);
}
#result{
font-size:22px;
margin-top:20px;
font-weight:bold;
transition:0.3s;
}
@keyframes pop{

0%{
transform:scale(.7);
opacity:0;
}

60%{
transform:scale(1.15);
opacity:1;
}

100%{
transform:scale(1);
}

}

.animate{
animation:pop .4s ease;
}
#history{
margin-top:20px;
text-align:left;
max-height:180px;
overflow-y:auto;
padding:10px;
background:#ececec;
border-radius:8px;
}

body.dark #history{
background:#3b3b3b;
}

#history li{
margin:6px 0;
font-size:15px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}


.quizTop{
display:flex;
justify-content:space-between;
align-items:center;
margin:15px 0;
}

.quizTop p{
margin:0;
font-size:18px;
font-weight:bold;
}
#resultCard{
display:none;
margin-top:20px;
padding:20px;
background:linear-gradient(135deg,#4CAF50,#2196F3);
color:white;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.3);
animation:pop .5s ease;
}

#resultCard h2{
margin-top:0;
}

#resultCard p{
font-size:20px;
margin:10px 0;
font-weight:bold;
} 
.closeBtn{
position:absolute;
top:10px;
right:10px;
width:35px;
height:35px;
border:none;
border-radius:50%;
background:red;
color:white;

display:flex;
justify-content:center;
align-items:center;

font-size:20px;
line-height:1;
padding:0;
cursor:pointer;
}

#resultCard{
position:relative;
}    
</style>

</head>

<body>

<div class="calculator">

<div class="topbar">

<h2>Souhardo Calculator</h2>

<button id="themeBtn">🌓</button>

</div>

<input id="num1" type="number" placeholder="Enter first number">

<br>

<input id="num2" type="number" placeholder="Enter second number">

<br>

<button onclick="calculate('+')">+</button>

<button onclick="calculate('-')">-</button>

<button onclick="calculate('*')">×</button>

<button onclick="calculate('/')">÷</button>

<br>

<button onclick="square()">x²</button>



<button onclick="root()">√</button>

<button onclick="startVoice()">🎤 Voice</button>

<h2 id="result">Answer =</h2>


<h3>📜 History</h3>

<ul id="history"></ul>

<button onclick="clearHistory()">🗑 Clear History</button>
<button onclick="showQuiz()">🧠 Quiz Mode</button>
<div id="quizBox" style="display:none;margin-top:20px;">

<h3>🧠 Math Quiz</h3>
<p id="chooseText"><b>Choose Difficulty</b></p>

<button onclick="startQuiz('easy')">🟢 Easy</button>

<button onclick="startQuiz('medium')">🟡 Medium</button>

<button onclick="startQuiz('hard')">🔴 Hard</button>

<hr>

<p id="question">Question will appear here</p>

<div class="quizTop">
    <p id="score">🏆 Score: 0/0</p>
    <p id="time">⏱ Time: 30s</p>
</div>

<input
id="quizAnswer"
type="number"
placeholder="Your Answer"
onkeydown="if(event.key==='Enter'){checkAnswer();}">

<br><br>

<button onclick="checkAnswer()">✅ Submit</button>


<p id="quizResult"></p>

<button onclick="restartQuiz()">🔄 Restart Quiz</button>
<div id="resultCard" style="display:none;">
<button class="closeBtn" onclick="closeQuiz()">×</button>
    
    <h2>🏆 Quiz Finished!</h2>

    <p id="finalScore"></p>

    <p id="finalPercentage"></p>

    <p id="finalGrade"></p>

    <button onclick="restartQuiz()">🔄 Play Again</button>
</div>
</div>

</div>
    
<script>
const correctSound = new Audio("correct.mp3");
const wrongSound = new Audio("wrong.mp3");
const finishSound = new Audio("finish.mp3");
    
const themeBtn=document.getElementById("themeBtn");
    
let score = 0;
let total = 0;
let correctAnswer = 0;
let difficulty = "easy";
let maxQuestions = 15;  
    
let timer;
let timeLeft = 30;
if(localStorage.getItem("theme")=="dark"){
document.body.classList.add("dark");
themeBtn.innerHTML="☀";
}

themeBtn.onclick=function(){

document.body.classList.toggle("dark");

if(document.body.classList.contains("dark")){
localStorage.setItem("theme","dark");
themeBtn.innerHTML="☀";
}else{
localStorage.setItem("theme","light");
themeBtn.innerHTML="🌙";
}

};

let history=JSON.parse(localStorage.getItem("history"))||[];

function showHistory(){

const list=document.getElementById("history");

list.innerHTML=""; history.forEach(function(item){

const li=document.createElement("li");

li.innerHTML=item;

list.appendChild(li);

});

}

showHistory();

function saveHistory(text){

history.unshift(text);

if(history.length>20){

history.pop();

}

localStorage.setItem("history",JSON.stringify(history));

showHistory();

}

function clearHistory(){

history=[];

localStorage.removeItem("history");

showHistory();

}

function showQuiz(){



document.getElementById("quizBox").style.display="block";

}
function startQuiz(level){

difficulty = level;
clearInterval(timer);
timeLeft = 30;
score = 0;
total = 0;

document.getElementById("score").innerHTML = "Score: 0/0";

document.getElementById("chooseText").style.display = "none";
    

    
nextQuestion();
document.getElementById("quizAnswer").value = "";        
}
function nextQuestion(){

clearInterval(timer);

timeLeft = 30;

document.getElementById("time").innerHTML =
"⏱ Time: "+timeLeft+"s";

timer = setInterval(function(){

timeLeft--;

document.getElementById("time").innerHTML =
"⏱ Time: "+timeLeft+"s";


if(timeLeft<=0){

clearInterval(timer);

alert("⏰ Time Up!");

nextQuestion();
document.getElementById("quizAnswer").value = "";
}

},1000);


let a,b,op;

if(difficulty=="easy"){

a=Math.floor(Math.random()*10)+1;
b=Math.floor(Math.random()*10)+1;

op="+";
correctAnswer=a+b;
document.getElementById("question").innerHTML =
"What is " + a + " + " + b + " ?";
}

else if(difficulty=="medium"){

a=Math.floor(Math.random()*50)+1;
b=Math.floor(Math.random()*50)+1;

let random=Math.floor(Math.random()*3);

if(random==0){

op="+";
correctAnswer=a+b;

}
else if(random==1){

op="-";
correctAnswer=a-b;

}
else{

op="×";
correctAnswer=a*b;

}
document.getElementById("question").innerHTML =
"What is " + a + " " + op + " " + b + " ?";
}

else{



let random = Math.floor(Math.random()*6);

if(random==0){

a=Math.floor(Math.random()*900)+100;
b=Math.floor(Math.random()*900)+100;

op="+";
correctAnswer=a+b;

}

else if(random==1){

a=Math.floor(Math.random()*900)+100;
b=Math.floor(Math.random()*400)+100;

op="-";
correctAnswer=a-b;

}

else if(random==2){

a=Math.floor(Math.random()*90)+10;
b=Math.floor(Math.random()*90)+10;

op="×";
correctAnswer=a*b;

}

else if(random==3){

b=Math.floor(Math.random()*20)+2;
correctAnswer=Math.floor(Math.random()*20)+2;
a=b*correctAnswer;

op="÷";

}

else if(random==4){

a=Math.floor(Math.random()*30)+11;

op="²";
correctAnswer=a*a;

}

else{

correctAnswer=Math.floor(Math.random()*20)+5;
a=correctAnswer*correctAnswer;

op="√";

}

if(op=="²"){

document.getElementById("question").innerHTML =
"What is "+a+"² ?";

}

else if(op=="√"){

document.getElementById("question").innerHTML =
"What is √"+a+" ?";

}

else{

document.getElementById("question").innerHTML =
"What is "+a+" "+op+" "+b+" ?";

}

document.getElementById("quizAnswer").value="";

return;

}

}

function checkAnswer(){

let userAnswer=Number(document.getElementById("quizAnswer").value);

total++;

if(userAnswer===correctAnswer){

score++;

document.getElementById("quizResult").innerHTML = "✅ Correct!";

}else{

document.getElementById("quizResult").innerHTML = "❌ Wrong!";

}

document.getElementById("score").innerHTML =
"Score: "+score+"/"+total;

if(total >= maxQuestions){

    clearInterval(timer);

    let percentage = Math.round((score/maxQuestions)*100);

    let grade;

    if(percentage>=90){
        grade="A+ 🏆";
    }else if(percentage>=80){
        grade="A ⭐";
    }else if(percentage>=70){
        grade="B 👍";
    }else if(percentage>=60){
        grade="C 🙂";
    }else{
        grade="F 😢";
    }

  
document.getElementById("question").style.display="none";

document.getElementById("quizAnswer").style.display="none";

document.getElementById("quizResult").style.display="none";

document.querySelector('button[onclick="checkAnswer()"]').style.display="none";

document.querySelector('button[onclick="restartQuiz()"]').style.display="none";

document.getElementById("resultCard").style.display="block";
    

    document.getElementById("finalScore").innerHTML =
    "Score: "+score+"/"+maxQuestions;

    document.getElementById("finalPercentage").innerHTML =
    "Percentage: "+percentage+"%";

    document.getElementById("finalGrade").innerHTML =
    "Grade: "+grade;

    return;
}
nextQuestion();
}    
function calculate(operator){

let a=Number(document.getElementById("num1").value);

let b=Number(document.getElementById("num2").value);

let answer;

if(operator=="+"){

answer=a+b;

}

else if(operator=="-"){

answer=a-b;

}

else if(operator=="*"){

answer=a*b;

}

else if(operator=="/"){

if(b==0){

answer="Cannot divide by zero";

}

else{

answer=a/b;

}

}

document.getElementById("result").innerHTML="Answer = "+answer;
const resultBox = document.getElementById("result");

resultBox.classList.remove("animate");
void resultBox.offsetWidth;
resultBox.classList.add("animate");


saveHistory(a+" "+operator+" "+b+" = "+answer);
}

function square(){

let a=Number(document.getElementById("num1").value);

let ans=a*a;


document.getElementById("result").innerHTML="Square = "+ans;

const resultBox = document.getElementById("result");

resultBox.classList.remove("animate");
void resultBox.offsetWidth;
resultBox.classList.add("animate");


saveHistory(a+"² = "+ans);

}

function root(){

let a=Number(document.getElementById("num1").value);

let ans=Math.sqrt(a);

document.getElementById("result").innerHTML="Square Root = "+ans;
const resultBox = document.getElementById("result");

resultBox.classList.remove("animate");
void resultBox.offsetWidth;
resultBox.classList.add("animate");   

saveHistory("√"+a+" = "+ans);

}
function restartQuiz(){

    clearInterval(timer);

    score = 0;
    total = 0;

    document.getElementById("score").innerHTML = "🏆 Score: 0/0";
    document.getElementById("quizResult").innerHTML = "";
    document.getElementById("quizAnswer").value = "";
document.getElementById("resultCard").style.display="none";
    nextQuestion();

}
function closeQuiz(){

    clearInterval(timer);

    document.getElementById("quizBox").style.display="none";

    document.getElementById("resultCard").style.display="none";

    document.getElementById("question").style.display="block";

    document.getElementById("quizAnswer").style.display="block";

    document.getElementById("quizResult").style.display="block";

    document.querySelector('button[onclick="checkAnswer()"]').style.display="inline-block";

    document.querySelector('button[onclick="restartQuiz()"]').style.display="inline-block";

    document.getElementById("chooseText").style.display="block";

}    

// 👇👇 Paste the startVoice() function here
function startVoice(){

const SpeechRecognition =
window.SpeechRecognition || window.webkitSpeechRecognition;



if(!SpeechRecognition){
    alert("Voice Recognition is not supported in this browser.");
    return;
}

const recognition = new SpeechRecognition();

recognition.lang = "en-US";
recognition.start();

recognition.onresult = function(event){

    let text = event.results[0][0].transcript.toLowerCase();

    text = text.replace(/plus/g,"+");
    text = text.replace(/minus/g,"-");
    text = text.replace(/times/g,"*");
    text = text.replace(/multiplied by/g,"*");
    text = text.replace(/divide by/g,"/");
    text = text.replace(/divided by/g,"/");

    try{

        let answer = eval(text);

    document.getElementById("result").innerHTML = "Answer = " + answer;

const resultBox = document.getElementById("result");

resultBox.classList.remove("animate");
void resultBox.offsetWidth;
resultBox.classList.add("animate");

saveHistory(text + " = " + answer);
    }catch{

        document.getElementById("result").innerHTML =
        "Sorry, I couldn't understand.";
const resultBox = document.getElementById("result");

resultBox.classList.remove("animate");
void resultBox.offsetWidth;
resultBox.classList.add("animate");
    }

};

recognition.onerror = function(){

    document.getElementById("result").innerHTML =
    "Voice Recognition Failed.";
const resultBox = document.getElementById("result");

resultBox.classList.remove("animate");
void resultBox.offsetWidth;
resultBox.classList.add("animate");
};

}  
</script>

</body>
</html>
