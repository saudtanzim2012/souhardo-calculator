<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Souhardo Calculator</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f2f2f2;
text-align:center;
transition:.3s;
}

body.dark{
background:#1f1f1f;
color:white;
}

.calculator{
width:360px;
margin:40px auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.2);
transition:.3s;
}

body.dark .calculator{
background:#2d2d2d;
}

input{
width:90%;
padding:10px;
margin:8px;
font-size:18px;
}


button{
padding:10px 15px;
margin:5px;
font-size:18px;
cursor:pointer;
border:none;
border-radius:8px;
transition:0.2s ease;
}

body.dark button{
background:#444;
color:white;
}

/* এখান থেকে নতুন কোড */

button:hover{
transform:translateY(-3px);
box-shadow:0 8px 18px rgba(0,0,0,.25);
}

button:active{
transform:scale(.95);
}
#result{
font-size:22px;
margin-top:20px;
font-weight:bold;
transition:0.3s;
}
@keyframes pop{

0%{
transform:scale(.7);
opacity:0;
}

60%{
transform:scale(1.15);
opacity:1;
}

100%{
transform:scale(1);
}

}

.animate{
animation:pop .4s ease;
}
#history{
margin-top:20px;
text-align:left;
max-height:180px;
overflow-y:auto;
padding:10px;
background:#ececec;
border-radius:8px;
}

body.dark #history{
background:#3b3b3b;
}

#history li{
margin:6px 0;
font-size:15px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

</style>

</head>

<body>

<div class="calculator">

<div class="topbar">

<h2>Souhardo Calculator</h2>

<button id="themeBtn">🌓</button>

</div>

<input id="num1" type="number" placeholder="Enter first number">

<br>

<input id="num2" type="number" placeholder="Enter second number">

<br>

<button onclick="calculate('+')">+</button>

<button onclick="calculate('-')">-</button>

<button onclick="calculate('*')">×</button>

<button onclick="calculate('/')">÷</button>

<br>

<button onclick="square()">x²</button>



<button onclick="root()">√</button>

<button onclick="startVoice()">🎤 Voice</button>

<h2 id="result">Answer =</h2>


<h3>📜 History</h3>

<ul id="history"></ul>

<button onclick="clearHistory()">🗑 Clear History</button>
<button onclick="showQuiz()">🧠 Quiz Mode</button>
<div id="quizBox" style="display:none;margin-top:20px;">

<h3>🧠 Math Quiz</h3>
<p id="chooseText"><b>Choose Difficulty</b></p>

<button onclick="startQuiz('easy')">🟢 Easy</button>

<button onclick="startQuiz('medium')">🟡 Medium</button>

<button onclick="startQuiz('hard')">🔴 Hard</button>

<hr>
</select>

<br><br>
<p id="question">Question will appear here</p>

<input
id="quizAnswer"
type="number"
placeholder="Your Answer">

<br><br>

<button onclick="checkAnswer()">✅ Submit</button>

<button onclick="nextQuestion()">➡ Next</button>

<p id="score">Score: 0/0</p>

</div>    
    
</div>

<script>

const themeBtn=document.getElementById("themeBtn");
    
let score = 0;
let total = 0;
let correctAnswer = 0;


if(localStorage.getItem("theme")=="dark"){
document.body.classList.add("dark");
themeBtn.innerHTML="☀";
}

themeBtn.onclick=function(){

document.body.classList.toggle("dark");

if(document.body.classList.contains("dark")){
localStorage.setItem("theme","dark");
themeBtn.innerHTML="☀";
}else{
localStorage.setItem("theme","light");
themeBtn.innerHTML="🌙";
}

};

let history=JSON.parse(localStorage.getItem("history"))||[];

function showHistory(){

const list=document.getElementById("history");

list.innerHTML=""; history.forEach(function(item){

const li=document.createElement("li");

li.innerHTML=item;

list.appendChild(li);

});

}

showHistory();

function saveHistory(text){

history.unshift(text);

if(history.length>20){

history.pop();

}

localStorage.setItem("history",JSON.stringify(history));

showHistory();

}

function clearHistory(){

history=[];

localStorage.removeItem("history");

showHistory();

}
function showQuiz(){

document.getElementById("quizBox").style.display="block";

nextQuestion();

}
function nextQuestion(){

let a=Math.floor(Math.random()*20)+1;

let b=Math.floor(Math.random()*20)+1;

correctAnswer=a+b;

document.getElementById("question").innerHTML=
"What is "+a+" + "+b+" ?";

document.getElementById("quizAnswer").value="";

}
function checkAnswer(){

let userAnswer=Number(document.getElementById("quizAnswer").value);

total++;

if(userAnswer===correctAnswer){

score++;

alert("✅ Correct!");

}else{

alert("❌ Wrong!");

}

document.getElementById("score").innerHTML=
"Score: "+score+"/"+total;

nextQuestion();

}    
function calculate(operator){

let a=Number(document.getElementById("num1").value);

let b=Number(document.getElementById("num2").value);

let answer;

if(operator=="+"){

answer=a+b;

}

else if(operator=="-"){

answer=a-b;

}

else if(operator=="*"){

answer=a*b;

}

else if(operator=="/"){

if(b==0){

answer="Cannot divide by zero";

}

else{

answer=a/b;

}

}

document.getElementById("result").innerHTML="Answer = "+answer;
const resultBox = document.getElementById("result");

resultBox.classList.remove("animate");
void resultBox.offsetWidth;
resultBox.classList.add("animate");


saveHistory(a+" "+operator+" "+b+" = "+answer);
}

function square(){

let a=Number(document.getElementById("num1").value);

let ans=a*a;


document.getElementById("result").innerHTML="Square = "+ans;

const resultBox = document.getElementById("result");

resultBox.classList.remove("animate");
void resultBox.offsetWidth;
resultBox.classList.add("animate");


saveHistory(a+"² = "+ans);

}

function root(){

let a=Number(document.getElementById("num1").value);

let ans=Math.sqrt(a);

document.getElementById("result").innerHTML="Square Root = "+ans;
const resultBox = document.getElementById("result");

resultBox.classList.remove("animate");
void resultBox.offsetWidth;
resultBox.classList.add("animate");   

saveHistory("√"+a+" = "+ans);

}


// 👇👇 Paste the startVoice() function here
function startVoice(){

const SpeechRecognition =
window.SpeechRecognition || window.webkitSpeechRecognition;



if(!SpeechRecognition){
    alert("Voice Recognition is not supported in this browser.");
    return;
}

const recognition = new SpeechRecognition();

recognition.lang = "en-US";
recognition.start();

recognition.onresult = function(event){

    let text = event.results[0][0].transcript.toLowerCase();

    text = text.replace(/plus/g,"+");
    text = text.replace(/minus/g,"-");
    text = text.replace(/times/g,"*");
    text = text.replace(/multiplied by/g,"*");
    text = text.replace(/divide by/g,"/");
    text = text.replace(/divided by/g,"/");

    try{

        let answer = eval(text);

    document.getElementById("result").innerHTML = "Answer = " + answer;

const resultBox = document.getElementById("result");

resultBox.classList.remove("animate");
void resultBox.offsetWidth;
resultBox.classList.add("animate");

saveHistory(text + " = " + answer);
    }catch{

        document.getElementById("result").innerHTML =
        "Sorry, I couldn't understand.";
const resultBox = document.getElementById("result");

resultBox.classList.remove("animate");
void resultBox.offsetWidth;
resultBox.classList.add("animate");
    }

};

recognition.onerror = function(){

    document.getElementById("result").innerHTML =
    "Voice Recognition Failed.";
const resultBox = document.getElementById("result");

resultBox.classList.remove("animate");
void resultBox.offsetWidth;
resultBox.classList.add("animate");
};

}  
</script>

</body>
</html>
