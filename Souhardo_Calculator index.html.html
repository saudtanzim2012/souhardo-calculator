<!DOCTYPE html>
<html>

<head>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Souhardo Calculator</title>

    <style>

        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
        }

        .calculator {

            width: 350px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 15px;

        }

        input {

            width: 90%;
            padding: 10px;
            margin: 8px;
            font-size: 18px;

        }

        button {

            padding: 10px 15px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;

        }

        #result {

            font-size: 22px;
            margin-top: 20px;

        }

    </style>

</head>


<body>


<div class="calculator">

<h1>Souhardo's Calculator</h1>


<input id="num1" type="number" placeholder="Enter first number">

<br>

<input id="num2" type="number" placeholder="Enter second number">


<br>


<button onclick="calculate('+')">+</button>

<button onclick="calculate('-')">-</button>

<button onclick="calculate('*')">×</button>

<button onclick="calculate('/')">÷</button>


<br>


<button onclick="square()">x²</button>

<button onclick="root()">√</button>



<h2 id="result">Answer = </h2>


</div>



<script>


function calculate(operator){

    let a = Number(document.getElementById("num1").value);

    let b = Number(document.getElementById("num2").value);

    let answer;


    if(operator == "+"){
        answer = a + b;
    }

    else if(operator == "-"){
        answer = a - b;
    }

    else if(operator == "*"){
        answer = a * b;
    }

    else if(operator == "/"){

        if(b == 0){

            answer = "Cannot divide by zero";

        }

        else{

            answer = a / b;

        }

    }


    document.getElementById("result").innerHTML =
    "Answer = " + answer;

}



function square(){

    let a = Number(document.getElementById("num1").value);

    document.getElementById("result").innerHTML =
    "Square = " + (a*a);

}



function root(){

    let a = Number(document.getElementById("num1").value);

    document.getElementById("result").innerHTML =
    "Square Root = " + Math.sqrt(a);

}


</script>


</body>

</html>
